name: One-shot true training tables
on:
  push:
    paths:
      - 'tools/one_shot_true_training_tables.py'
      - '.github/workflows/one-shot-true-training-tables.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert training section to true tables
        run: python tools/one_shot_true_training_tables.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Render trainings as true responsive tables"
            git push
          fi
