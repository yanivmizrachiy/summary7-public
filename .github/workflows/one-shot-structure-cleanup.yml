name: One-shot structure cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-structure-cleanup.yml'
      - 'tools/one_shot_structure_cleanup.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split HTML and CSS and restore author photo
        run: python3 tools/one_shot_structure_cleanup.py
      - name: Commit structural cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Simplify Summary 7 structure and restore author photo"
            git push
          fi
