name: One-shot clean Summary 7 index

on:
  push:
    paths:
      - '.github/workflows/one-shot-clean-index.yml'
      - 'tools/one_shot_clean_index.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicated CSS safely
        run: python3 tools/one_shot_clean_index.py
      - name: Commit cleaned index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Clean duplicate Summary 7 CSS layers"
            git push
          fi
