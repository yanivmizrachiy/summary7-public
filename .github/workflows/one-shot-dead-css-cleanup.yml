name: One-shot dead CSS cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-dead-css-cleanup.yml'
      - 'tools/one_shot_dead_css_cleanup.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove proven-dead legacy CSS
        run: python3 tools/one_shot_dead_css_cleanup.py
      - name: Commit CSS cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove dead legacy CSS"
            git push
          fi
