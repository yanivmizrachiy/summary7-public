name: Premium polish Summary 7

on:
  push:
    paths:
      - '.github/workflows/premium-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium design system
        run: python3 tools/polish_summary7.py

      - name: Commit polished site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Deep premium polish for Summary 7"
            git push
          fi
