name: One-shot training A4 pages
on:
  push:
    paths:
      - 'tools/one_shot_training_pages.py'
      - '.github/workflows/one-shot-training-pages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split training table into A4 pages
        run: python tools/one_shot_training_pages.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore training table across A4 pages"
            git push
          fi
