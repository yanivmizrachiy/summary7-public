name: One-shot mobile fit

on:
  push:
    paths:
      - '.github/workflows/one-shot-mobile-fit.yml'
      - 'tools/one_shot_mobile_fit.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile fit patch
        run: python3 tools/one_shot_mobile_fit.py
      - name: Commit mobile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix mobile horizontal overflow and phone table layouts"
            git push
          fi
