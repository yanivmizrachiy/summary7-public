name: One-shot weekly news update

on:
  push:
    paths:
      - '.github/workflows/one-shot-update-weekly-news.yml'
      - 'tools/one_shot_update_weekly_news.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update weekly news
        run: python3 tools/one_shot_update_weekly_news.py
      - name: Commit weekly news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update weekly news section"
            git push
          fi
