name: One-shot grade pages
on:
  push:
    paths:
      - 'tools/one_shot_grade_pages.py'
      - '.github/workflows/one-shot-grade-pages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grade page correction
        run: python tools/one_shot_grade_pages.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make each grade a separate teaching page"
            git push
          fi
