name: One-shot consolidate layout
on:
  push:
    paths:
      - 'tools/one_shot_consolidate_layout.py'
      - '.github/workflows/one-shot-consolidate-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate layout CSS
        run: python tools/one_shot_consolidate_layout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Consolidate layout CSS and keep headings at top"
            git push
          fi
