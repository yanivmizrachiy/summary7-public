name: One-shot A4 science page
on:
  push:
    paths:
      - 'tools/one_shot_a4_science_page.py'
      - '.github/workflows/one-shot-a4-science-page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply A4 science page patch
        run: python tools/one_shot_a4_science_page.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make science announcement a dedicated A4 page"
            git push
          fi
