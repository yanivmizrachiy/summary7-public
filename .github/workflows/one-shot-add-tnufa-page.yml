name: One-shot add Tnufa page
on:
  push:
    paths:
      - 'tools/one_shot_add_tnufa_page.py'
      - '.github/workflows/one-shot-add-tnufa-page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Tnufa page
        run: python tools/one_shot_add_tnufa_page.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add green A4 Tnufa exam page"
            git push
          fi
