name: One-shot conflict cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-conflict-cleanup.yml'
      - 'tools/one_shot_conflict_cleanup.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean CSS conflicts
        run: python3 tools/one_shot_conflict_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Clean remaining CSS conflicts"
            git push
          fi
