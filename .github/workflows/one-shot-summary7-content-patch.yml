name: One-shot Summary 7 content patch
on:
  push:
    paths:
      - 'tools/one_shot_summary7_content_patch.py'
      - '.github/workflows/one-shot-summary7-content-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content patch
        run: python tools/one_shot_summary7_content_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Polish October pages and add science program"
            git push
          fi
