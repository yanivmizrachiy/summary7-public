name: One-shot heading and news style
on:
  push:
    paths:
      - 'tools/one_shot_heading_and_news_style.py'
      - '.github/workflows/one-shot-heading-and-news-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update headings and weekly news style
        run: python tools/one_shot_heading_and_news_style.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine grade headings and weekly news wording"
            git push
          fi
