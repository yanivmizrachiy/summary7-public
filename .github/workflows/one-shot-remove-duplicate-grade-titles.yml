name: One-shot remove duplicate grade titles
on:
  push:
    paths:
      - 'tools/one_shot_remove_duplicate_grade_titles.py'
      - '.github/workflows/one-shot-remove-duplicate-grade-titles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate grade titles
        run: python tools/one_shot_remove_duplicate_grade_titles.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove duplicate grade titles"
            git push
          fi
