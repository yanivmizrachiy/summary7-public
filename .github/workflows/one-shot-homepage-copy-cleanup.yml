name: One-shot homepage copy cleanup
on:
  push:
    paths:
      - 'tools/one_shot_homepage_copy_cleanup.py'
      - '.github/workflows/one-shot-homepage-copy-cleanup.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/one_shot_homepage_copy_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Align homepage copy with previous weekly summaries" && git push)
