name: One-shot dead CSS cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-dead-css.yml'
      - 'tools/one_shot_dead_css.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove verified unused legacy CSS
        run: python3 tools/one_shot_dead_css.py
      - name: Commit cleaned index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Remove unused legacy CSS from Summary 7"
            git push
          fi
