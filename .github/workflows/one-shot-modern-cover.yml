name: One-shot modern cover migration
on:
  push:
    paths:
      - 'tools/one_shot_modern_cover.py'
      - '.github/workflows/one-shot-modern-cover.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/one_shot_modern_cover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git diff --cached --quiet || (git commit -m "Align Summary 7 cover with latest weekly design" && git push)
