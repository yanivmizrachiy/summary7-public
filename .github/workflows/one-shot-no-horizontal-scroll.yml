name: One-shot no horizontal scroll
on:
  push:
    paths:
      - 'tools/one_shot_no_horizontal_scroll.py'
      - '.github/workflows/one-shot-no-horizontal-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply overflow guard
        run: python tools/one_shot_no_horizontal_scroll.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prevent horizontal scrolling on mobile"
            git push
          fi
