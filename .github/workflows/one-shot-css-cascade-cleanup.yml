name: One-shot CSS cascade cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-css-cascade-cleanup.yml'
      - 'tools/one_shot_css_cascade_cleanup.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete cascade leftovers
        run: python3 tools/one_shot_css_cascade_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Clean obsolete CSS cascade leftovers"
            git push
          fi
