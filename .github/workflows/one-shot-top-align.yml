name: one-shot top align
on:
  push:
    paths:
      - 'tools/one_shot_top_align.py'
      - '.github/workflows/one-shot-top-align.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Force content to top
        run: python tools/one_shot_top_align.py
      - name: Commit result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Yaniv Raz"
          git config user.email "yanivmiz77@gmail.com"
          git add styles.css
          git commit -m "Force page content to start at top"
          git push origin HEAD:main
